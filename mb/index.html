<style>
  :root{
    --dark:#1A1625; --deep:#100D1E; --violet:#7C5CBF; --teal:#2ABFBF;
    --fondo:#F7F6FA; --superficie:#FFFFFF; --texto:#1A1625; --tenue:#6B6580; --linea:#E2DDEF;
    --sombra:0 1px 2px rgba(16,13,30,.06), 0 12px 32px rgba(16,13,30,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fondo:#100D1E; --superficie:#1A1625; --texto:#F7F6FA; --tenue:#A9A2BE; --linea:#2E2840;
      --sombra:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --fondo:#100D1E; --superficie:#1A1625; --texto:#F7F6FA; --tenue:#A9A2BE; --linea:#2E2840;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .envoltorio{max-width:440px;margin:0 auto;padding:28px 16px 40px}
  .tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
  .cabecera{position:relative;background:var(--dark);color:#F7F6FA;padding:30px 24px 26px;overflow:hidden}
  .cabecera::before{content:"";position:absolute;width:64px;height:64px;border-radius:50%;background:var(--teal);right:26px;top:-18px;opacity:.9}
  .cabecera::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--violet);right:100px;top:34px}
  .marca{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#C9C3DA}
  .identidad{display:flex;gap:16px;align-items:center;margin-top:22px;position:relative}
  .retrato{flex:0 0 auto;width:72px;height:72px;border-radius:50%;overflow:hidden;border:2px solid rgba(247,246,250,.18)}
  .retrato img{display:block;width:100%;height:100%;object-fit:cover}
  .nombre{font-family:Cambria,Caladea,Georgia,serif;font-weight:400;font-size:28px;line-height:1.1;margin:0 0 6px}
  .cargo{margin:0;font-size:15px;color:#C9C3DA}
  .acciones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:22px 24px}
  .boton{display:flex;align-items:center;gap:9px;padding:13px 14px;border:1px solid var(--linea);border-radius:10px;
    background:transparent;color:var(--texto);text-decoration:none;font:inherit;font-size:15px;cursor:pointer;text-align:left;
    transition:border-color .15s, background-color .15s}
  .boton:hover{border-color:var(--violet);background:rgba(124,92,191,.08)}
  .boton:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .boton svg{flex:0 0 auto;width:18px;height:18px;stroke:var(--violet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .boton--ancho{grid-column:1/-1;justify-content:center}
  .boton--principal{background:var(--violet);border-color:var(--violet);color:#fff;font-size:16px;padding:15px}
  .boton--principal svg{stroke:#fff}
  .boton--principal:hover{background:#6A4CAB;border-color:#6A4CAB}
  .bloque{border-top:1px solid var(--linea);padding:20px 24px;text-align:center}
  .rotulo{margin:0 0 14px;font-size:14px;color:var(--tenue)}
  .qr-marco{display:inline-block;background:#fff;padding:12px;border:1px solid var(--linea);border-radius:10px}
  .qr-marco img{display:block;width:180px;height:180px;image-rendering:pixelated}
  .bloque p.nota{margin:12px auto 0;font-size:13.5px;color:var(--tenue);max-width:32ch}
  .pie{padding:14px 24px 18px;border-top:1px solid var(--linea);text-align:center;font-size:13.5px;color:var(--tenue)}
  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
    background:var(--deep);color:#F7F6FA;padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  @media (max-width:360px){.acciones{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
  var datos=["Mariano Barbiero","Jova Software - Software Architect & AI Solutions","Mobile: +54 9 341 307-4757","marianobarbiero@gmail.com","linkedin.com/in/mariano-barbiero","Rosario, Santa Fe, Argentina"].join("\n");
  var aviso;
  // Android descarga el .vcf en vez de abrirlo: abrimos Contactos con los datos precargados y dejamos el .vcf como respaldo.
  if(/Android/i.test(navigator.userAgent)){
    var vcf=new URL("mariano-barbiero.vcf",location.href).href;
    var e=encodeURIComponent;
    document.getElementById("guardar").href="intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;"+
      "S.name="+e("Mariano Barbiero")+";S.phone="+e("+5493413074757")+";i.phone_type=2;S.email="+e("marianobarbiero@gmail.com")+";"+
      "S.company="+e("Jova Software")+";S.job_title="+e("Software Architect & AI Solutions")+";"+
      "S.browser_fallback_url="+e(vcf)+";end";
    document.getElementById("guardar").removeAttribute("download");
  }
  function mostrar(t){ if(aviso)aviso.remove(); aviso=document.createElement("div"); aviso.className="aviso"; aviso.setAttribute("role","status"); aviso.textContent=t; document.body.appendChild(aviso); setTimeout(function(){ if(aviso){aviso.remove();aviso=null;} },2600); }
  function respaldo(){ var c=document.createElement("textarea"); c.value=datos; c.style.position="fixed"; c.style.opacity="0"; document.body.appendChild(c); c.select(); var ok=false; try{ok=document.execCommand("copy");}catch(e){} c.remove(); mostrar(ok?"Details copied":"Could not copy details"); }
  document.getElementById("copiar").addEventListener("click",function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(datos).then(function(){mostrar("Details copied");}).catch(respaldo); } else respaldo();
  });
})();
